<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>認証 - 分岐図鑑書架</title>
    <style>
        :root { --bg-color: #fcfcfc; --text-color: #222; --border-color: #ddd; }
        body { font-family: "Yu Mincho", serif; margin: 0; padding: 4rem 2rem; background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center;}
        .container { width: 100%; max-width: 400px; background: #fff; padding: 3rem; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.03); text-align: center; }
        h1 { font-size: 1.5rem; margin-top: 0; border-bottom: 1px solid var(--text-color); padding-bottom: 0.5rem; font-weight: normal;}
        .form-group { margin-bottom: 1.5rem; text-align: left; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .form-group input { width: 100%; padding: 0.6rem; box-sizing: border-box; border: 1px solid var(--border-color); font-family: sans-serif; font-size: 1rem; }
        button { width: 100%; padding: 0.8rem; border: 1px solid var(--text-color); background: var(--text-color); color: white; font-family: inherit; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        button:hover { background: #444; }
        .error-box { margin-bottom: 1rem; padding: 0.7rem 0.8rem; border: 1px solid #d88; background: #fff4f4; color: #8f2b2b; text-align: left; font-size: 0.9rem; }
        a { color: #666; font-size: 0.9rem; text-decoration: none; display: block; margin-top: 1rem; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        {% if mode == "login" %}
            <h1 data-i18n="title_login">入室 (ログイン)</h1>
            {% if error %}
                <div id="authError" class="error-box" data-error-code="{{ error }}">認証に失敗しました。ユーザー名またはパスワードをご確認ください。</div>
            {% endif %}
            <form action="/login" method="POST">
                <div class="form-group"><label>Username</label><input type="text" name="username" value="{{ username or '' }}" required></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <button type="submit" data-i18n="btn_login">認証</button>
            </form>
            <a href="/register" data-i18n="link_reg">新規登録はこちら</a>
        {% else %}
            <h1 data-i18n="title_reg">資格登録 (ユーザー登録)</h1>
            {% if error %}
                <div id="authError" class="error-box" data-error-code="{{ error }}">新規登録に失敗しました。入力内容をご確認のうえ、再度お試しください。</div>
            {% endif %}
            <form action="/register" method="POST">
                <div class="form-group"><label>Username</label><input type="text" name="username" value="{{ username or '' }}" required></div>
                <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
                <button type="submit" data-i18n="btn_reg">登録</button>
            </form>
            <a href="/login" data-i18n="link_login">既にお持ちの方はこちら</a>
        {% endif %}
    </div>

    <script>
        const i18n = {
            ja: {
                title_login: "入室 (ログイン)",
                btn_login: "認証",
                link_reg: "新規登録はこちら",
                title_reg: "資格登録 (ユーザー登録)",
                btn_reg: "登録",
                link_login: "既にお持ちの方はこちら",
                err_login_invalid: "認証に失敗しました。ユーザー名またはパスワードをご確認ください。",
                err_register_exists: "このユーザー名は既に使用されています。別のユーザー名をお試しください。",
                err_register_failed: "新規登録に失敗しました。入力内容をご確認のうえ、再度お試しください。"
            },
            en: {
                title_login: "Sign In",
                btn_login: "Login",
                link_reg: "Create an account",
                title_reg: "Sign Up",
                btn_reg: "Register",
                link_login: "Already have an account?",
                err_login_invalid: "Sign in failed. Please check your username or password.",
                err_register_exists: "That username is already taken. Please choose another one.",
                err_register_failed: "Sign up failed. Please check your input and try again."
            }
        };
        const mode = "{{ mode }}";
        const lang = localStorage.getItem("cladogram_lang") || "ja";
        document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = i18n[lang][el.getAttribute("data-i18n")]);

        const authError = document.getElementById("authError");
        if (authError) {
            const code = authError.getAttribute("data-error-code");
            let key = "err_register_failed";
            if (mode === "login") key = "err_login_invalid";
            if (mode === "register" && code === "exists") key = "err_register_exists";
            authError.textContent = i18n[lang][key] || i18n.ja[key];
        }
    </script>
</body>
</html>
